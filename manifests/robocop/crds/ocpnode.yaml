---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ocpnodes.ocp.io
spec:
  group: ocp.io
  names:
    kind: OCPNode
    listKind: OCPNodeList
    plural: ocpnodes
    singular: ocpnode
    shortNames:
    - node
    - nodes
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - role
            - providerRef
            properties:
              role:
                type: string
                enum:
                - control-plane
                - worker
                description: "Node role: control-plane or worker"

              providerRef:
                type: string
                description: "Name of OCPNodeProvider to use"

              # Hetzner-specific overrides
              serverType:
                type: string
                description: "Hetzner server type override"
              location:
                type: string
                description: "Hetzner location override"
              image:
                type: string
                description: "Hetzner image override"

              # SSH-specific overrides
              host:
                type: string
                description: "SSH host override"
              user:
                type: string
                description: "SSH user override"

              # GPU support
              gpu:
                type: boolean
                default: false
                description: "Node has GPU (auto-install drivers)"

              # Taints/tolerations
              taints:
                type: array
                description: "Additional taints for this node"
                items:
                  type: object
                  required:
                  - key
                  - effect
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                    effect:
                      type: string
                      enum:
                      - NoSchedule
                      - PreferNoSchedule
                      - NoExecute

              labels:
                type: object
                additionalProperties:
                  type: string
                description: "Additional labels for this node"

          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                - Pending
                - Provisioning
                - Installing
                - Joining
                - Ready
                - Failed
                - Terminating
                description: "Current node phase"

              providerId:
                type: string
                description: "Provider-specific ID (e.g., Hetzner server ID)"

              publicIP:
                type: string
                description: "Public IP address"

              privateIP:
                type: string
                description: "Private IP address (if applicable)"

              kubernetesNodeName:
                type: string
                description: "Name of corresponding Kubernetes Node object"

              conditions:
                type: array
                description: "Node conditions"
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time

              createdAt:
                type: string
                format: date-time
                description: "When node was created"

              joinedAt:
                type: string
                format: date-time
                description: "When node joined cluster"

              message:
                type: string
                description: "Human-readable status message"

    additionalPrinterColumns:
    - name: Role
      type: string
      jsonPath: .spec.role
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: IP
      type: string
      jsonPath: .status.publicIP
    - name: Provider
      type: string
      jsonPath: .spec.providerRef
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp

    subresources:
      status: {}
