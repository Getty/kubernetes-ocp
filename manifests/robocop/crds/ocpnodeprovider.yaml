---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ocpnodeproviders.ocp.io
spec:
  group: ocp.io
  names:
    kind: OCPNodeProvider
    listKind: OCPNodeProviderList
    plural: ocpnodeproviders
    singular: ocpnodeprovider
    shortNames:
    - provider
    - providers
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                enum:
                - hetzner
                - ssh
                description: "Provider type: hetzner or ssh"

              hetzner:
                type: object
                description: "Hetzner Cloud configuration"
                required:
                - tokenSecretRef
                properties:
                  tokenSecretRef:
                    type: object
                    required:
                    - name
                    properties:
                      name:
                        type: string
                        description: "Secret name containing Hetzner API token"
                      key:
                        type: string
                        default: token
                        description: "Key in secret (default: token)"
                  location:
                    type: string
                    default: fsn1
                    description: "Default location (fsn1, nbg1, hel1)"
                  serverType:
                    type: string
                    default: cx23
                    description: "Default server type (cx23, cx32, etc.)"
                  image:
                    type: string
                    default: debian-13
                    description: "Default OS image"

              ssh:
                type: object
                description: "SSH provider configuration"
                properties:
                  user:
                    type: string
                    default: root
                    description: "SSH user (default: root)"
                  keySecretRef:
                    type: object
                    required:
                    - name
                    properties:
                      name:
                        type: string
                        description: "Secret name containing SSH private key"
                      key:
                        type: string
                        default: privateKey
                        description: "Key in secret (default: privateKey)"

          status:
            type: object
            properties:
              ready:
                type: boolean
                description: "Provider is configured and ready"
              message:
                type: string
                description: "Status message"
              lastChecked:
                type: string
                format: date-time
                description: "Last health check timestamp"

    additionalPrinterColumns:
    - name: Type
      type: string
      jsonPath: .spec.type
    - name: Ready
      type: boolean
      jsonPath: .status.ready
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
