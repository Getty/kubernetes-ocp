---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robocop
  namespace: ocp-system
  labels:
    app: robocop
spec:
  replicas: 1
  strategy:
    type: Recreate  # Only one instance should run at a time
  selector:
    matchLabels:
      app: robocop
  template:
    metadata:
      labels:
        app: robocop
    spec:
      serviceAccountName: robocop
      containers:
      - name: controller
        image: raudssus/ocp:latest
        imagePullPolicy: Always
        command:
        - robocop
        - controller
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
