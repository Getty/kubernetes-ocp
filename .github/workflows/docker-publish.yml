# Build and publish OCP Docker image to Docker Hub
# Forgejo-compatible workflow using native Docker commands
name: Docker Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  DOCKERHUB_REPO: raudssus/ocp

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name ocp-builder --driver docker-container
          docker buildx inspect --bootstrap

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Determine Docker tags
        id: tags
        run: |
          TAGS=""

          # For tagged releases (v1.2.3)
          if [[ "${{ github.ref }}" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            TAGS="${DOCKERHUB_REPO}:${VERSION},${DOCKERHUB_REPO}:${MAJOR}.${MINOR},${DOCKERHUB_REPO}:${MAJOR},${DOCKERHUB_REPO}:latest"
          # For main/master branch
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            TAGS="${DOCKERHUB_REPO}:${BRANCH_NAME},${DOCKERHUB_REPO}:latest"
          # For PRs
          elif [[ "${{ github.ref }}" =~ ^refs/pull/([0-9]+)/merge$ ]]; then
            PR_NUM="${BASH_REMATCH[1]}"
            TAGS="${DOCKERHUB_REPO}:pr-${PR_NUM}"
          # For other branches
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            TAGS="${DOCKERHUB_REPO}:${BRANCH_NAME}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Docker tags: ${TAGS}"

      - name: Build and push
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR: build only, don't push
            docker buildx build \
              --platform linux/amd64 \
              -t ${{ env.DOCKERHUB_REPO }}:pr-test \
              .
          else
            # Push to Docker Hub
            IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
            TAG_ARGS=""
            for tag in "${TAG_ARRAY[@]}"; do
              TAG_ARGS="${TAG_ARGS} -t ${tag}"
            done

            docker buildx build \
              --platform linux/amd64 \
              --push \
              ${TAG_ARGS} \
              .
          fi
