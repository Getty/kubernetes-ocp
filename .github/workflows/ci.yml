# GitHub CI for kubernetes-ocp — runs this repository's own .cicd jobs through
# SimpiCI's action.
#
# SimpiCI derives the plan from the .cicd file names: docker+29+build.image.sh
# builds, docker+29+publish.image.sh publishes, both in docker.io/library/
# docker:29, and the publish phase starts only after the build phase passed.
# Which registries exist, and that only main and tags publish at all, is
# decided in those scripts — in this repository, under review. Not here.
#
# ONE JOB PER REGISTRY, and that is not an accident. SimpiCI hands each .cicd
# container exactly one CICD_REGISTRY / _USER / _PASSWORD triple, so a single
# run publishes to a single registry. We want the image in two places, so there
# are two jobs. They are independent: Docker Hub going down, or its secrets
# being absent, does not stop the GHCR publish. The cost is that the image is
# built twice, once per runner.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USER    Docker Hub account with push rights on raudssus/ocp
#   DOCKERHUB_TOKEN   a Docker Hub access token, not the account password
# Without them the dockerhub job still builds and simply skips its publish
# (exit 78, which SimpiCI counts as a skip). GHCR needs no secret at all — the
# run's own GITHUB_TOKEN is enough.
#
# The GHCR image name follows the repository name on purpose: a GHCR package
# created by a repository's own GITHUB_TOKEN is linked to that repository
# automatically, while any other name has to be granted access by hand in the
# package settings ("Manage Actions access") before the token may push to it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # ─── vendor: unreleased sibling dists (k222) ───────────────────────────────
  # The Dockerfile installs what vendor/ORDER lists ahead of the snapshot pass,
  # and `make vendor` dzil-builds that from sibling checkouts a runner does not
  # have. So check the siblings out (default branch, full history so the
  # version comes out of the tags), run that same target, and hand vendor/ to
  # both image jobs. Keep the checkouts in step with the Makefile's VENDOR
  # list; with VENDOR= the artifact is just an empty ORDER.
  #
  # CI sees what is PUSHED to the siblings. A fix that is only committed
  # locally reaches a local `make build`, not this job.
  vendor:
    runs-on: ubuntu-latest
    container:
      image: perl:5.40-bookworm
    defaults:
      run:
        shell: bash
    env:
      PERL_CPANM_OPT: --mirror http://cpan.metacpan.org --mirror-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: pplu/io-k8s-p5
          path: siblings/io-k8s-p5
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: Getty/rex-gpu
          path: siblings/rex-gpu
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: Getty/p5-crypt-age
          path: siblings/p5-crypt-age
          fetch-depth: 0
      - name: Install Dist::Zilla and the siblings' author deps
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          cpanm -nq Dist::Zilla
          for s in io-k8s-p5 rex-gpu p5-crypt-age; do
            ( cd "siblings/$s" && dzil authordeps --missing | cpanm -nq )
          done
      - run: make vendor SIBLINGS_DIR="$GITHUB_WORKSPACE/siblings"
      - uses: actions/upload-artifact@v7
        with:
          name: vendor
          path: vendor/
          if-no-files-found: error

  # Primary home. raudssus/ocp is the name the Makefile, OCP::Cmd::DeployImage,
  # the robocop manifests and xt/smoke.sh already agree on (t/66 guards it), so
  # it is what the README tells people to pull.
  dockerhub:
    needs: vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: vendor
          path: vendor
      - uses: Getty/simpici/action@main
        env:
          CICD_REGISTRY: docker.io
          CICD_REGISTRY_USER: ${{ vars.DOCKERHUB_USER }}
          CICD_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          CICD_IMAGE_REPOSITORY: raudssus/ocp
          CICD_PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' }}

  # Second location for the same image, so one registry being unreachable never
  # costs us the artifact.
  ghcr:
    needs: vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: vendor
          path: vendor
      - uses: Getty/simpici/action@main
        env:
          CICD_REGISTRY: ghcr.io
          CICD_REGISTRY_USER: ${{ github.actor }}
          CICD_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          CICD_IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          CICD_PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' }}
