---
apiVersion: v1
kind: Namespace
metadata:
  name: ocp-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: robocop
  namespace: ocp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: robocop
rules:
# OCP CRDs
- apiGroups:
  - ocp.internal
  resources:
  - ocpnodes
  - ocpnodeproviders
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

- apiGroups:
  - ocp.internal
  resources:
  - ocpnodes/status
  - ocpnodeproviders/status
  verbs:
  - get
  - update
  - patch

# Core Kubernetes Nodes.
#
# The verbs follow OCP::Node one for one: get (_wait_ready, _verify), patch
# (teardown cordons the node with spec.unschedulable) and delete (teardown
# removes the Node object once the server is gone).
#
# `delete` was missing, and the failure is silent by construction: the call
# sits in an eval whose result teardown ignores, so a 403 left the OCPNode CR
# deleted and the Node object behind as NotReady while teardown reported
# success -- the same shape of bug as the api-version defect in karr #21.
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
  - patch
  - update
  - delete

# Secrets (for provider credentials, SSH keys)
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: robocop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: robocop
subjects:
- kind: ServiceAccount
  name: robocop
  namespace: ocp-system
