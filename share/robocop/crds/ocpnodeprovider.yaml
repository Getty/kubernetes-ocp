---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ocpnodeproviders.ocp.internal
spec:
  group: ocp.internal
  names:
    kind: OCPNodeProvider
    listKind: OCPNodeProviderList
    plural: ocpnodeproviders
    singular: ocpnodeprovider
    shortNames:
    - provider
    - providers
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                enum:
                - hetzner
                - ssh
                - local
                description: "Provider type: hetzner, ssh, or local"

              clusterName:
                type: string
                description: >-
                  Name of the OCP cluster this provider serves (the `name:`
                  from ocp.yaml). It becomes the ocp-cluster label on every
                  server created through the provider, and the selector
                  `ocp destroy` deletes by. The CR carries it because nothing
                  in the cluster can supply it: OCPNode is trigger-neutral and
                  robocop knows no cluster identity beyond what is stored here.
                  Deriving it from metadata.name instead labelled workers
                  ocp-cluster=<type>-default, which no teardown ever found.

              hetzner:
                type: object
                description: "Hetzner Cloud configuration"
                required:
                - tokenSecretRef
                properties:
                  tokenSecretRef:
                    type: object
                    required:
                    - name
                    properties:
                      name:
                        type: string
                        description: "Secret name containing Hetzner API token"
                      key:
                        type: string
                        default: token
                        description: "Key in secret (default: token)"
                  # No `default:` on these three, deliberately.
                  #
                  # They are rank 3 of the four OCP::Provider::Hetzner resolves
                  # (node spec > provider CR > code default), and a structural
                  # default destroys that rank: the API server materialises it
                  # into every CR that leaves the field out, after which "this
                  # provider says nothing" is indistinguishable from "this
                  # provider chose exactly this" and the code default below it
                  # becomes unreachable.
                  #
                  # It was not theoretical. serverType carried `default: cx23`,
                  # a type Hetzner does not sell (the line is cx22/cx32/cx42/
                  # cx52), and `ocp apply` writes spec.hetzner without these
                  # fields — so every cluster's provider CR read back cx23
                  # while every server came up cx32 (karr #100). The same three
                  # fields on the OCPNode CRD have carried no default all
                  # along; this matches them.
                  #
                  # `ocp apply` migrates a CR that already has the materialised
                  # values: ensure_crds runs immediately before
                  # ensure_provider_cr on both the deploy and the drift path,
                  # and Kubernetes::REST::ensure PUTs the whole object, so with
                  # the default gone the stale values are not written back.
                  location:
                    type: string
                    description: >-
                      Default location (fsn1, nbg1, hel1) for nodes of this
                      provider that do not set spec.location themselves.
                      Leave unset to fall through to the code default (fsn1).
                  serverType:
                    type: string
                    description: >-
                      Default server type (cx22, cx32, cpx21, cax21, ...) for
                      nodes of this provider that do not set spec.serverType
                      themselves. Leave unset to fall through to the code
                      default (cx32).
                  image:
                    type: string
                    description: >-
                      Default OS image for nodes of this provider that do not
                      set spec.image themselves. Leave unset to fall through
                      to the code default (debian-13).
                  sshKeyName:
                    type: string
                    description: >-
                      Name of the SSH key in the Hetzner project that every
                      server created through this provider references
                      (ocp-<cluster>-admin, uploaded during bootstrap).
                      Without it a worker would boot with an empty
                      authorized_keys and be unreachable.

              ssh:
                type: object
                description: "SSH provider configuration"
                properties:
                  user:
                    type: string
                    default: root
                    description: "SSH user (default: root)"
                  keySecretRef:
                    type: object
                    required:
                    - name
                    properties:
                      name:
                        type: string
                        description: "Secret name containing SSH private key"
                      key:
                        type: string
                        default: privateKey
                        description: "Key in secret (default: privateKey)"

          status:
            type: object
            properties:
              ready:
                type: boolean
                description: "Provider is configured and ready"
              message:
                type: string
                description: "Status message"
              lastChecked:
                type: string
                format: date-time
                description: "Last health check timestamp"

    additionalPrinterColumns:
    - name: Type
      type: string
      jsonPath: .spec.type
    - name: Ready
      type: boolean
      jsonPath: .status.ready
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
