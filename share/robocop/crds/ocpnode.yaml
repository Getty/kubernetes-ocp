---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ocpnodes.ocp.internal
spec:
  group: ocp.internal
  names:
    kind: OCPNode
    listKind: OCPNodeList
    plural: ocpnodes
    singular: ocpnode
    shortNames:
    - node
    - nodes
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - role
            - providerRef
            properties:
              role:
                type: string
                enum:
                - control-plane
                - worker
                description: "Node role: control-plane or worker"

              providerRef:
                type: string
                description: "Name of OCPNodeProvider to use"

              # Hetzner-specific overrides
              serverType:
                type: string
                description: "Hetzner server type override"
              location:
                type: string
                description: "Hetzner location override"
              image:
                type: string
                description: "Hetzner image override"

              # SSH-specific overrides
              host:
                type: string
                description: "SSH host override"
              user:
                type: string
                description: "SSH user override"

              # GPU support. No default on purpose (k208): an absent gpu
              # follows the cluster-wide gpu.enabled, and only an explicit
              # value is a per-node decision. A schema default would be
              # stamped into every CR by the API server and read as one.
              gpu:
                type: boolean
                description: "Per-node GPU switch; absent follows the cluster-wide gpu.enabled"

              # Taints/tolerations
              taints:
                type: array
                description: "Additional taints for this node"
                items:
                  type: object
                  required:
                  - key
                  - effect
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                    effect:
                      type: string
                      enum:
                      - NoSchedule
                      - PreferNoSchedule
                      - NoExecute

              labels:
                type: object
                additionalProperties:
                  type: string
                description: "Additional labels for this node"

          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                - Pending
                - Provisioning
                - Installing
                - Joining
                - Ready
                - Failed
                - Terminating
                description: "Current node phase"

              providerId:
                type: string
                description: "Provider-specific ID (e.g., Hetzner server ID)"

              publicIP:
                type: string
                description: "Address OCP connects to and tears the machine down by (spec.host for ssh nodes, so possibly a hostname)"

              address:
                type: string
                description: "Node address as the cluster reports it (ExternalIP, else InternalIP), set once the node is Ready"

              privateIP:
                type: string
                description: "Private IP address (if applicable)"

              kubernetesNodeName:
                type: string
                description: "Name of corresponding Kubernetes Node object"

              hostKeys:
                type: array
                description: "SSH host keys pinned at the first contact (trust on first use); every later contact is verified against them. Reset with 'ocp node trust-host'"
                items:
                  type: object
                  required:
                  - type
                  - fingerprint
                  - key
                  properties:
                    type:
                      type: string
                      description: "Key type, e.g. ssh-ed25519"
                    fingerprint:
                      type: string
                      description: "SHA256 fingerprint as ssh-keygen -l prints it"
                    key:
                      type: string
                      description: "The public key, base64 as in known_hosts"

              conditions:
                type: array
                description: "Node conditions"
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time

              createdAt:
                type: string
                format: date-time
                description: "When node was created"

              joinedAt:
                type: string
                format: date-time
                description: "When node joined cluster"

              message:
                type: string
                description: "Human-readable status message"

              lastReconcileTime:
                type: string
                format: date-time
                description: "Timestamp of last reconcile action"

              reconciler:
                type: string
                enum:
                - cli
                - robocop
                description: "Which reconciler last acted on this node"

    additionalPrinterColumns:
    - name: Role
      type: string
      jsonPath: .spec.role
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: IP
      type: string
      jsonPath: .status.publicIP
    - name: Address
      type: string
      jsonPath: .status.address
    - name: Provider
      type: string
      jsonPath: .spec.providerRef
    - name: Reconciler
      type: string
      jsonPath: .status.reconciler
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp

    subresources:
      status: {}
