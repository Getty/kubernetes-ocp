---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robocop
  namespace: ocp-system
  labels:
    app: robocop
spec:
  replicas: 1
  strategy:
    type: Recreate  # Only one instance should run at a time
  selector:
    matchLabels:
      app: robocop
  template:
    metadata:
      labels:
        app: robocop
    spec:
      serviceAccountName: robocop
      # Pin to the control-plane node: robocop only ever needs to run where
      # the CP server lives (always amd64 in this project — see k10).
      # Workers may be a different arch (e.g. arm64 GB10/DGX Spark, karr
      # k25), which is irrelevant if robocop never lands there.
      #
      # RKE2 applies node-role.kubernetes.io/control-plane AND
      # node-role.kubernetes.io/master (label + NoSchedule taint) to server
      # nodes; match/tolerate by key presence only (operator: Exists, no
      # value), same convention already used for nfd-master and
      # gpu-operator in OCP::Cmd::Apply::Workloads. share/Rexfile's
      # untaint_control_plane task removes both taints by key for the same
      # reason and is unused by default, so the taints normally stay in
      # place even on single-node clusters.
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      containers:
      - name: controller
        image: raudssus/ocp:latest
        imagePullPolicy: Always
        command:
        - robocop
        - controller
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Credentials the controller needs (OCP::Robocop::Controller::from_env
        # reads them as required env vars). All three are delivered through the
        # robocop-credentials Secret that `ocp deploy-robocop` writes at deploy
        # time (k129, Weg A). The RKE2 join token is NOT readable in-cluster
        # via the K8s API -- it is a file on the CP disk that also encrypts the
        # datastore bootstrap data -- so it travels here as the rke2-token Secret
        # key rather than being read from the cluster.
        #
        # This is the `secret` variant. For robocop.security_level inject (k2)
        # both deploy paths rewrite it through OCP::Robocop::Manifest: no
        # ROBO_SSH_KEY, ROBO_SSH_PUBLIC_KEY + ROBOCOP_SECURITY_LEVEL instead,
        # /tmp on tmpfs, and a readinessProbe on the key-held file.
        #
        # OCP_DISTRIBUTION and OCP_POD_CIDR are deliberately NOT here: both
        # deploy paths add them from ocp.yaml (OCP::Robocop::Manifest->for_config,
        # k186/k184), and a value in this file would be a guess robocop acts
        # on. Applied without them, robocop exits at startup and says why.
        - name: ROBO_SSH_KEY
          valueFrom:
            secretKeyRef:
              name: robocop-credentials
              key: robo-ssh-key
        - name: RKE2_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: robocop-credentials
              key: server-url
        - name: RKE2_TOKEN
          valueFrom:
            secretKeyRef:
              name: robocop-credentials
              key: rke2-token
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
