                operator:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                driver:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                toolkit:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                devicePlugin:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                dcgm:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                dcgmExporter:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                gfd:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                nfd:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                migManager:
