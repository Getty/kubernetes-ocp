---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodefeatures.nfd.k8s-sigs.io
  annotations:
    api-approved.kubernetes.io: "https://github.com/kubernetes-sigs/node-feature-discovery/pull/1269"
spec:
  group: nfd.k8s-sigs.io
  names:
    kind: NodeFeature
    listKind: NodeFeatureList
    plural: nodefeatures
    singular: nodefeature
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                features:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                labels:
                  type: object
                  additionalProperties:
                    type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodefeaturerules.nfd.k8s-sigs.io
  annotations:
    api-approved.kubernetes.io: "https://github.com/kubernetes-sigs/node-feature-discovery/pull/1269"
spec:
  group: nfd.k8s-sigs.io
  names:
    kind: NodeFeatureRule
    listKind: NodeFeatureRuleList
    plural: nodefeaturerules
    singular: nodefeaturerule
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                      labelsTemplate:
                        type: string
                      vars:
                        type: object
                        additionalProperties:
                          type: string
                      varsTemplate:
                        type: string
                      taints:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            value:
                              type: string
                            effect:
                              type: string
                          required:
                            - key
                            - effect
                      annotations:
                        type: object
                        additionalProperties:
                          type: string
                      extendedResources:
                        type: object
                        additionalProperties:
                          type: string
                      matchFeatures:
                        type: array
                        items:
                          type: object
                          properties:
                            feature:
                              type: string
                            matchExpressions:
                              type: object
                              additionalProperties:
                                type: object
                                properties:
                                  op:
                                    type: string
                                    enum:
                                      - In
                                      - NotIn
                                      - InRegexp
                                      - Exists
                                      - DoesNotExist
                                      - Gt
                                      - Lt
                                      - GtLt
                                      - IsTrue
                                      - IsFalse
                                  value:
                                    type: array
                                    items:
                                      type: string
                                required:
                                  - op
                      matchAny:
                        type: array
                        items:
                          type: object
                          properties:
                            matchFeatures:
                              type: array
                              items:
                                type: object
                                properties:
                                  feature:
                                    type: string
                                  matchExpressions:
                                    type: object
                                    additionalProperties:
                                      type: object
                                      properties:
                                        op:
                                          type: string
                                        value:
                                          type: array
                                          items:
                                            type: string
                                      required:
                                        - op
                    required:
                      - name
