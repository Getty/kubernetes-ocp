---
# SSH Provider for existing bare metal servers
apiVersion: ocp.io/v1
kind: OCPNodeProvider
metadata:
  name: ssh-baremetal
  namespace: ocp-system
spec:
  type: ssh
  ssh:
    user: root
    keySecretRef:
      name: ocp-ssh-key
      key: privateKey
---
# Secret with SSH private key
apiVersion: v1
kind: Secret
metadata:
  name: ocp-ssh-key
  namespace: ocp-system
type: Opaque
stringData:
  privateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ... (your SSH private key) ...
    -----END OPENSSH PRIVATE KEY-----
---
# GPU Server Node
apiVersion: ocp.io/v1
kind: OCPNode
metadata:
  name: avatar
  namespace: ocp-system
spec:
  role: control-plane
  providerRef: ssh-baremetal
  host: avatar.conflict.industries
  gpu: true
  labels:
    gpu.nvidia.com/class: "A6000"
