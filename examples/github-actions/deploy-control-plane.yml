# Omni Control Plane - Deploy Control Plane
# Copy this to your repo's .github/workflows/ directory
#
# Required Secrets:
#   SSH_PRIVATE_KEY     - SSH key with root access to target server
#   CONTROL_PLANE_HOST  - IP or hostname of the control plane server
#
# Optional Secrets:
#   K3S_TOKEN           - Pre-defined cluster token (auto-generated if not set)

name: Deploy Control Plane

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Control plane host (IP or hostname)'
        required: false
        type: string
      k3s_version:
        description: 'K3s version'
        required: false
        default: 'v1.31.3+k3s1'
        type: string

env:
  OCP_PATH: ./vendor/ocp  # Adjust to your ocp submodule/copy location

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy Control Plane
        env:
          OCP_SSH_KEY: ~/.ssh/id_rsa
          OCP_K3S_VERSION: ${{ inputs.k3s_version }}
        run: |
          HOST="${{ inputs.host || secrets.CONTROL_PLANE_HOST }}"

          if [ -n "${{ secrets.K3S_TOKEN }}" ]; then
            ${{ env.OCP_PATH }}/bin/install-control-plane "$HOST" \
              --token="${{ secrets.K3S_TOKEN }}" \
              --kubeconfig=./kubeconfig
          else
            ${{ env.OCP_PATH }}/bin/install-control-plane "$HOST" \
              --kubeconfig=./kubeconfig
          fi

      - name: Save Kubeconfig
        uses: actions/upload-artifact@v4
        with:
          name: kubeconfig
          path: kubeconfig
          retention-days: 1

      - name: Verify Cluster
        env:
          KUBECONFIG: ./kubeconfig
        run: |
          kubectl get nodes
          kubectl get pods -A
