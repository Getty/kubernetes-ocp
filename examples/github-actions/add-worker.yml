# Omni Control Plane - Add Worker Node
# Copy this to your repo's .github/workflows/ directory
#
# Required Secrets:
#   SSH_PRIVATE_KEY     - SSH key with root access to target server
#   K3S_SERVER_URL      - K3s API URL (e.g., https://1.2.3.4:6443)
#   K3S_TOKEN           - K3s cluster join token
#
# Optional Secrets:
#   KUBECONFIG          - Base64-encoded kubeconfig for verification

name: Add Worker Node

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Worker node host (IP or hostname)'
        required: true
        type: string
      role:
        description: 'Node role'
        required: false
        default: 'worker'
        type: choice
        options:
          - worker
          - server
      labels:
        description: 'Node labels (comma-separated)'
        required: false
        type: string

env:
  OCP_PATH: ./vendor/ocp

jobs:
  add-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add Node
        env:
          OCP_SSH_KEY: ~/.ssh/id_rsa
        run: |
          ARGS="--server=${{ secrets.K3S_SERVER_URL }} --token=${{ secrets.K3S_TOKEN }}"
          ARGS="$ARGS --role=${{ inputs.role }}"

          if [ -n "${{ inputs.labels }}" ]; then
            ARGS="$ARGS --labels=${{ inputs.labels }}"
          fi

          ${{ env.OCP_PATH }}/bin/add-node "${{ inputs.host }}" $ARGS

      - name: Verify Node
        if: ${{ secrets.KUBECONFIG != '' }}
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ./kubeconfig
          export KUBECONFIG=./kubeconfig

          # Wait for node to appear
          for i in {1..30}; do
            if kubectl get node | grep -q "${{ inputs.host }}"; then
              echo "Node joined successfully!"
              kubectl get nodes
              exit 0
            fi
            sleep 10
          done

          echo "Warning: Node not yet visible"
          kubectl get nodes
