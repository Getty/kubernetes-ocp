# Omni Control Plane - Add Docker Worker (vast.ai, etc.)
# Copy this to your repo's .github/workflows/ directory
#
# Required Secrets:
#   SSH_PRIVATE_KEY     - SSH key with root access to target server
#   K3S_TOKEN           - K3s cluster join token
#   CONTROL_PLANE_IP    - Control plane IP (for tunnel mode)
#
# Optional Secrets:
#   K3S_SERVER_URL      - K3s API URL (only for direct mode)
#   KUBECONFIG          - Base64-encoded kubeconfig for verification

name: Add Docker Worker

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Docker host (IP or hostname)'
        required: true
        type: string
      mode:
        description: 'Connection mode'
        required: false
        default: 'tunnel'
        type: choice
        options:
          - direct
          - tunnel
          - vastai
      node_name:
        description: 'Custom node name (optional)'
        required: false
        type: string
      labels:
        description: 'Node labels (comma-separated)'
        required: false
        type: string

env:
  OCP_PATH: ./vendor/ocp

jobs:
  add-docker-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # For tunnel mode, we need to allow the Docker host to SSH back
          # This requires the control plane to accept SSH from the worker

      - name: Add Docker Node
        env:
          OCP_SSH_KEY: ~/.ssh/id_rsa
        run: |
          ARGS="--token=${{ secrets.K3S_TOKEN }} --mode=${{ inputs.mode }}"

          case "${{ inputs.mode }}" in
            direct)
              ARGS="$ARGS --server=${{ secrets.K3S_SERVER_URL }}"
              ;;
            tunnel|vastai)
              ARGS="$ARGS --control-plane=${{ secrets.CONTROL_PLANE_IP }}"
              ;;
          esac

          if [ -n "${{ inputs.node_name }}" ]; then
            ARGS="$ARGS --node-name=${{ inputs.node_name }}"
          fi

          if [ -n "${{ inputs.labels }}" ]; then
            ARGS="$ARGS --labels=${{ inputs.labels }}"
          fi

          ${{ env.OCP_PATH }}/bin/add-docker-node "${{ inputs.host }}" $ARGS

      - name: Verify Node
        if: ${{ secrets.KUBECONFIG != '' }}
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ./kubeconfig
          export KUBECONFIG=./kubeconfig

          echo "Waiting for node to join..."
          sleep 30
          kubectl get nodes -o wide
