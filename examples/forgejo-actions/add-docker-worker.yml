# Omni Control Plane - Add Docker Worker (Forgejo Actions)
# Copy this to your repo's .forgejo/workflows/ directory
#
# Required Secrets:
#   SSH_PRIVATE_KEY     - SSH key with root access to target server
#   K3S_TOKEN           - K3s cluster join token
#   CONTROL_PLANE_IP    - Control plane IP (for tunnel mode)

name: Add Docker Worker

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Docker host (IP or hostname)'
        required: true
        type: string
      mode:
        description: 'Connection mode (direct, tunnel, vastai)'
        required: false
        default: 'tunnel'
        type: string
      node_name:
        description: 'Custom node name (optional)'
        required: false
        type: string
      labels:
        description: 'Node labels (comma-separated)'
        required: false
        type: string

env:
  OCP_PATH: ./vendor/ocp

jobs:
  add-docker-node:
    runs-on: docker
    container:
      image: debian:bookworm-slim
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y openssh-client curl git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add Docker Node
        env:
          OCP_SSH_KEY: ~/.ssh/id_rsa
        run: |
          ARGS="--token=${{ secrets.K3S_TOKEN }} --mode=${{ inputs.mode }}"

          case "${{ inputs.mode }}" in
            direct)
              ARGS="$ARGS --server=${{ secrets.K3S_SERVER_URL }}"
              ;;
            tunnel|vastai)
              ARGS="$ARGS --control-plane=${{ secrets.CONTROL_PLANE_IP }}"
              ;;
          esac

          if [ -n "${{ inputs.node_name }}" ]; then
            ARGS="$ARGS --node-name=${{ inputs.node_name }}"
          fi

          if [ -n "${{ inputs.labels }}" ]; then
            ARGS="$ARGS --labels=${{ inputs.labels }}"
          fi

          ${{ env.OCP_PATH }}/bin/add-docker-node "${{ inputs.host }}" $ARGS

      - name: Show Result
        run: |
          echo "Docker node ${{ inputs.host }} added in ${{ inputs.mode }} mode"
