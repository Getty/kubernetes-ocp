# Omni Control Plane - Docker Compose Example
#
# Usage:
#   1. Copy this directory to your project
#   2. Copy cluster.env.example to cluster.env and configure
#   3. Run: docker compose run ocp install-control-plane
#
# All commands run inside the container - no local tools needed!

services:
  ocp:
    build:
      context: ../..
      dockerfile: Dockerfile
    # Or use pre-built image (comment out build section):
    # image: raudssus/kubernetes-ocp:latest
    volumes:
      # SSH key (required)
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
      # Output directory for kubeconfig
      - ./output:/output
    environment:
      - OCP_SSH_KEY=/root/.ssh/id_rsa
      - OCP_K3S_VERSION=${K3S_VERSION:-v1.31.3+k3s1}
    working_dir: /ocp
    # Override entrypoint for interactive use
    entrypoint: ["/bin/bash", "-c"]

  # Convenience service for setup
  setup:
    extends: ocp
    command: |
      install-control-plane ${CONTROL_PLANE_HOST} \
        --token=${K3S_TOKEN} \
        --kubeconfig=/output/kubeconfig

  # Add a worker
  add-worker:
    extends: ocp
    command: |
      add-node ${WORKER_HOST} \
        --server=https://${CONTROL_PLANE_HOST}:6443 \
        --token=${K3S_TOKEN}

  # Add a Docker node (vast.ai etc.)
  add-docker:
    extends: ocp
    command: |
      add-docker-node ${DOCKER_HOST} \
        --token=${K3S_TOKEN} \
        --mode=${DOCKER_MODE:-tunnel} \
        --control-plane=${CONTROL_PLANE_HOST}

  # Get cluster status
  status:
    extends: ocp
    command: |
      export KUBECONFIG=/output/kubeconfig
      kubectl get nodes -o wide
      echo ""
      kubectl get pods -A

  # Interactive shell
  shell:
    extends: ocp
    command: ["/bin/bash"]
    stdin_open: true
    tty: true
