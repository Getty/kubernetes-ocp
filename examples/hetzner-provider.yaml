---
# Hetzner Cloud Provider
apiVersion: ocp.io/v1
kind: OCPNodeProvider
metadata:
  name: hetzner-fsn1
  namespace: ocp-system
spec:
  type: hetzner
  hetzner:
    tokenSecretRef:
      name: hetzner-api-token
      key: token
    location: fsn1
    serverType: cx32
    image: debian-13
---
# Secret with Hetzner API token
apiVersion: v1
kind: Secret
metadata:
  name: hetzner-api-token
  namespace: ocp-system
type: Opaque
stringData:
  token: your-hetzner-api-token-here
---
# Control Plane on Hetzner
apiVersion: ocp.io/v1
kind: OCPNode
metadata:
  name: police-1
  namespace: ocp-system
spec:
  role: control-plane
  providerRef: hetzner-fsn1
  serverType: cx32  # Override default
---
# Worker on Hetzner
apiVersion: ocp.io/v1
kind: OCPNode
metadata:
  name: worker-1
  namespace: ocp-system
spec:
  role: worker
  providerRef: hetzner-fsn1
  serverType: cx23  # Smaller for workers
  labels:
    node-role.kubernetes.io/worker: ""
